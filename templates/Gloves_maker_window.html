<!DOCTYPE html>
<html>
<head>
<title>Makers - Ambassador Sports</title>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { width: 100%; background-color: #e0e0e0; border: 1px solid #ccc; }
    th { background-color: #007bff; color: white; text-align: center; padding: 15px; }
    td { padding: 10px; }
    input[type="text"] { width: calc(100% - 22px); padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .footer { text-align: center; margin-top: 20px; color: #888; }
</style>
</head>
<body>
  <table>
    <tr>
      <th colspan="3">
        <h1>AMBASSADOR SPORTS</h1>
        <h3>Data Management System</h3>
      </th>
    </tr>
    <tr>
      <td colspan="3" style="text-align: center;">
        <h2 style="color: #007bff; margin: 0;">GLOVES MAKERS</h2>
      </td>
    </tr>
    <tr>
      <td colspan="3" style="padding: 10px;">
        <input type="text" id="search" placeholder="Search">
      </td>
    </tr>
    <tr>
      <th>Maker Name</th>
      <th>Address</th>
      <th>Contact No</th>
    </tr>
    {% for maker in makers %}
    <tr>
      <td>{{ maker.name }}</td>
      <td>{{ maker.unit_address }}</td>
      <td>{{ maker.contact_no }}</td>
    </tr>
    {% endfor %}
  </table>

  <div class="footer">
    <p>AMBASSADOR SPORTS &copy; 2024. All Rights Reserved.</p>
  </div>

  <script>
    document.getElementById("search").addEventListener("keyup", function () {
      var q = this.value.toLowerCase();
      document.querySelectorAll("table tr").forEach(function (r) {
        if (r.cells.length === 3 && r.cells[0].tagName === "TD" && !r.querySelector("input") && !r.querySelector("h2")) {
          r.style.display = r.innerText.toLowerCase().indexOf(q) > -1 ? "" : "none";
        }
      });
    });
  </script>
</body>
</html>
