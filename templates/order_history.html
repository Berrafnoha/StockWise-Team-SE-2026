{% extends "base.html" %}
{% block content %}
<h2 style="color:#007bff">{{ label }} - Order History</h2>
<div class="toolbar"><input type="text" id="search" placeholder="Search"><a class="btn" href="/{{ line }}/order_history/add">New order</a></div>
<table>
  <tr><th>Product</th><th>Maker</th><th>Quantity</th><th>Delivered</th><th>Pending</th><th>Price per item</th><th>Total price</th></tr>
  {% for o in orders %}
  <tr class="row"><td>{{ o[0] }}</td><td>{{ o[1] }}</td><td>{{ o[2] }}</td><td>{{ o[3] }}</td><td>{{ o[4] }}</td><td>{{ o[5] }}</td><td>{{ o[6] }}</td></tr>
  {% else %}
  <tr><td colspan="7">No orders yet.</td></tr>
  {% endfor %}
</table>
{% endblock %}
