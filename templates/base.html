<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ambassador Sports</title>
<style>
 body { font-family: Arial, sans-serif; margin: 20px; background: #f2f2f2; }
 .header { background: #007bff; color: #fff; text-align: center; padding: 15px; border-radius: 6px 6px 0 0; }
 .header h1, .header h3 { margin: 5px; }
 .nav { background: #fff; padding: 10px 15px; border-bottom: 1px solid #ddd; }
 .nav a { margin-right: 15px; color: #007bff; text-decoration: none; font-weight: bold; }
 .content { background: #fff; padding: 20px; border-radius: 0 0 6px 6px; }
 table { width: 100%; border-collapse: collapse; }
 th { background: #007bff; color: #fff; padding: 10px; text-align: left; }
 td { padding: 10px; border-bottom: 1px solid #ddd; }
 tr.row:hover td { background: #f4f8ff; }
 input[type=text] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
 .btn { display: inline-block; background: #007bff; color: #fff; padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
 .btn-danger { background: #dc3545; }
 .toolbar { display: flex; gap: 10px; margin-bottom: 15px; }
 .toolbar input { flex: 1; }
 .error { background: #f8d7da; color: #842029; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
 .footer { text-align: center; margin-top: 20px; color: #888; }
</style>
</head>
<body>
<div class="header"><h1>AMBASSADOR SPORTS</h1><h3>Data Management System</h3></div>
<div class="nav">
  <a href="/home">Home</a>
  {% if line %}
  <a href="/{{ line }}/products">Products</a>
  <a href="/{{ line }}/makers">Makers</a>
  <a href="/{{ line }}/order_history">Order History</a>
  {% endif %}
</div>
<div class="content">
{% block content %}{% endblock %}
</div>
<div class="footer"><p>AMBASSADOR SPORTS &copy; 2026. All Rights Reserved.</p></div>
<script>
 var s = document.getElementById("search");
 if (s) {
   s.addEventListener("keyup", function () {
     var q = this.value.toLowerCase();
     document.querySelectorAll("tr.row").forEach(function (r) {
       r.style.display = r.innerText.toLowerCase().indexOf(q) > -1 ? "" : "none";
     });
   });
 }
</script>
</body>
</html>
