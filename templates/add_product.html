{% extends "base.html" %}
{% block content %}
<h2 style="color:#007bff">{{ label }} - Add a product</h2>
<form method="post">
  <table>
    <tr><td>Product name:</td><td><input type="text" name="product_name" required></td></tr>
    <tr><td>Size:</td><td><input type="text" name="size"></td></tr>
    <tr><td>Material:</td><td><input type="text" name="material"></td></tr>
    <tr><td>Colour:</td><td><input type="text" name="colour"></td></tr>
    <tr><td>Description:</td><td><input type="text" name="description"></td></tr>
  </table>
  <p><button class="btn" type="submit">Save</button> <a href="/{{ line }}/products">Cancel</a></p>
</form>
{% endblock %}
