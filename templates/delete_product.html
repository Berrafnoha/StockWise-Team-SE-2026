{% extends "base.html" %}
{% block content %}
<h2 style="color:#007bff">{{ label }} - Delete a product</h2>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<table>
  <tr><th>ID</th><th>Name</th><th>Size</th><th></th></tr>
  {% for p in products %}
  <tr class="row">
    <td>{{ p[0] }}</td><td>{{ p[1] }}</td><td>{{ p[2] }}</td>
    <td>
      <form method="post" style="margin:0">
        <input type="hidden" name="delete_item" value="{{ p[0] }}">
        <button class="btn btn-danger" type="submit">Delete</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="4">No products.</td></tr>
  {% endfor %}
</table>
<p><a href="/{{ line }}/products">Back to products</a></p>
{% endblock %}
