{% extends "base.html" %}
{% block content %}
<h2 style="color:#007bff">Choose a product line</h2>
<div style="display:flex; gap:20px; flex-wrap:wrap">
{% for key, label in lines.items() %}
  <div style="flex:1; min-width:200px; border:1px solid #ddd; border-radius:8px; padding:20px; text-align:center">
    <h2 style="color:#007bff">{{ label|upper }}</h2>
    <p><a class="btn" href="/{{ key }}/products">Products</a></p>
    <p><a class="btn" href="/{{ key }}/makers">Makers</a></p>
    <p><a class="btn" href="/{{ key }}/order_history">Order History</a></p>
  </div>
{% endfor %}
</div>
{% endblock %}
